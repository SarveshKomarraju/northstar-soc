<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NORTHSTAR SOC — Mail</title>

    <!--
        Mail-specific stylesheet.
        Make sure this path matches your project structure.
    -->
    <link rel="stylesheet" href="./mail.css">
</head>

<body>

    <!-- =====================================================
         NORTHSTAR MAIL APPLICATION

         MailRenderer.js completely builds the interface
         inside this container.

         Do NOT put the inbox UI directly in here.
         ===================================================== -->

    <div id="mail-app" class="mail-app-container" tabindex="-1"></div>


    <!-- =====================================================
         MAIL APPLICATION
         ===================================================== -->

    <script type="module">

        import {
            initializeMail
        } from "./MailApp.js";


        /* =================================================
           INITIALIZE MAIL
           ================================================= */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                const container =
                    document.getElementById(
                        "mail-app"
                    );

                if (!container) {

                    console.error(
                        "[MAIL] Application container not found."
                    );

                    return;
                }


                try {

                    window.mailApp =
                        initializeMail(
                            container,
                            {
                                autoFocus: false,
                                preserveState: true
                            }
                        );

                    console.log(
                        "%c[NORTHSTAR MAIL] ONLINE",
                        "font-weight:bold;"
                    );

                } catch (error) {

                    console.error(
                        "[NORTHSTAR MAIL] Failed to initialize:",
                        error
                    );

                    container.innerHTML = `
                        <div
                            style="
                                height:100%;
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                background:#08111f;
                                color:#8fa3bd;
                                font-family:monospace;
                            "
                        >
                            <div
                                style="
                                    text-align:center;
                                    max-width:520px;
                                    padding:32px;
                                "
                            >

                                <div
                                    style="
                                        color:#d8e2f0;
                                        font-size:18px;
                                        font-weight:600;
                                        margin-bottom:10px;
                                    "
                                >
                                    MAIL APPLICATION ERROR
                                </div>

                                <div
                                    style="
                                        font-size:12px;
                                        line-height:1.7;
                                    "
                                >
                                    NORTHSTAR Mail failed to initialize.
                                </div>

                                <div
                                    style="
                                        margin-top:16px;
                                        padding:12px;
                                        border:1px solid #26384f;
                                        background:#0b1728;
                                        color:#70859f;
                                        font-size:11px;
                                        text-align:left;
                                        overflow:auto;
                                    "
                                >
                                    ${escapeHtml(
                        error?.message ||
                        String(error)
                    )}
                                </div>

                            </div>
                        </div>
                    `;
                }

            }
        );


        /* =================================================
           SAFE ERROR DISPLAY
           ================================================= */

        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

    </script>

</body>

</html>
